[workspace]
resolver = "2"
members = [
    "optischeduling-core",
    "optischeduling-cli",
    "optischeduling-server",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
authors = ["Bunlong Prak", "Bovisal Zhou"]
license = "MIT"
description = "High-performance Rust automated university course scheduling engine for OptiScheduling"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

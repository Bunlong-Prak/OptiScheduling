services:
  mysql:
    image: mysql:8.0
    container_name: optischeduling-mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: optischeduling
      MYSQL_USER: opti
      MYSQL_PASSWORD: optipass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./docker/mysql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 3s
      retries: 10

  scheduler:
    build:
      context: ./rust_scheduler
      dockerfile: ../docker/Dockerfile.scheduler
    container_name: optischeduling-rust-scheduler
    restart: unless-stopped
    environment:
      PORT: 8085
      HOST: 0.0.0.0
      RUST_LOG: info
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build:
      context: ./fyp
      dockerfile: ../docker/Dockerfile.web
    container_name: optischeduling-web
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://opti:optipass@mysql:3306/optischeduling
      DOMAIN: http://localhost:3000
      OPTISCHEDULING_RUST_URL: http://scheduler:8085
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      scheduler:
        condition: service_healthy

volumes:
  mysql_data:
